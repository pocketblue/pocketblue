# Fairphone 5 tmpfiles configuration

# Sensor calibration and runtime data
d /var/lib/sensors 0755 root root -
d /run/ssc 0755 root root -
d /run/fastrpc 0777 root root -
d /dev/shm/qcom 0777 root root -

# Firmware extracted from the device by blob-wrangler
# (/usr/lib/firmware/updates symlinks here)
d /var/lib/firmware-extract 0755 root root -

# socinfo is what the ADSP asks hexagonrpcd for. It is not firmware and is not
# on any partition - Android synthesises it at runtime - so it ships in the
# image and is copied into the extracted tree. soc_id and revision match
# /sys/devices/soc0 on the FP5; the rest are constants for this platform.
C /var/lib/blob-wrangler/sensors/socinfo - - - - /usr/share/pocketblue/fp5-socinfo

# Persistent journal. Without this the journal is volatile, so a failed boot
# takes its own logs with it - which is exactly what happened the first time
# this image was booted.
d /var/log/journal 2755 root systemd-journal -
