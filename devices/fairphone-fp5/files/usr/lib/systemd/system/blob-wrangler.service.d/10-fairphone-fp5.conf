# The first extraction copies ~200M (DSP trees, acdb, modem_pr) and squashes an
# 88M modem.mbn, so give it room rather than letting the default start timeout
# cut it short.
[Service]
TimeoutStartSec=600

# Load the modules whose firmware only exists once extraction has run. They are
# blacklisted so udev does not probe them too early; venus needs an explicit
# reload because it fails probe hard rather than deferring. Until msm loads the
# display runs on the simple framebuffer u-boot handed over.
ExecStartPost=-/usr/sbin/modprobe msm
ExecStartPost=-/usr/libexec/fp5-load-dsp
ExecStartPost=-/usr/sbin/modprobe ipa
ExecStartPost=-/usr/sbin/modprobe hci_uart
ExecStartPost=-/usr/sbin/modprobe -r venus_core
ExecStartPost=-/usr/sbin/modprobe venus_core
